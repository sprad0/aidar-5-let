<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-label="Стилизованная карта Якутска с отметкой детского центра">
  <defs>
    <pattern id="mapDots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.4" fill="#0d1230" opacity=".09"/>
    </pattern>
    <filter id="pinShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="5" dy="6" stdDeviation="0" flood-color="#0d1230" flood-opacity=".3"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="#f1e8d5"/>
  <rect width="1200" height="900" fill="url(#mapDots)"/>

  <!-- кварталы -->
  <g fill="#e2d5ba" stroke="#cbbb99" stroke-width="3">
    <rect x="40" y="80" width="190" height="120" rx="10"/>
    <rect x="270" y="60" width="210" height="140" rx="10"/>
    <rect x="520" y="70" width="170" height="120" rx="10"/>
    <rect x="730" y="60" width="210" height="140" rx="10"/>
    <rect x="980" y="80" width="170" height="120" rx="10"/>

    <rect x="40" y="260" width="180" height="150" rx="10"/>
    <rect x="260" y="250" width="170" height="150" rx="10"/>
    <rect x="470" y="260" width="210" height="140" rx="10"/>
    <rect x="720" y="270" width="160" height="130" rx="10"/>

    <rect x="40" y="470" width="170" height="140" rx="10"/>
    <rect x="250" y="470" width="150" height="140" rx="10"/>
    <rect x="440" y="480" width="170" height="120" rx="10"/>

    <rect x="40" y="660" width="180" height="140" rx="10"/>
    <rect x="260" y="670" width="180" height="130" rx="10"/>
    <rect x="480" y="660" width="200" height="140" rx="10"/>
    <rect x="720" y="680" width="170" height="120" rx="10"/>
  </g>

  <!-- парки -->
  <g fill="#b9d5a2" stroke="#8db27a" stroke-width="3">
    <rect x="760" y="470" width="260" height="190" rx="18"/>
    <circle cx="820" cy="520" r="14" fill="#8db27a"/>
    <circle cx="870" cy="560" r="18" fill="#8db27a"/>
    <circle cx="930" cy="510" r="12" fill="#8db27a"/>
    <circle cx="970" cy="580" r="16" fill="#8db27a"/>
    
    <rect x="250" y="320" width="150" height="120" rx="16" fill="#cfe3bb"/>
  </g>

  <!-- река -->
  <path d="M980-40c-60 150-40 250 40 340s90 200 30 330-60 220 10 320h180V-40Z" fill="#8cd6ef" stroke="#5aaecb" stroke-width="4"/>
  <path d="M1010 0c-46 140-20 220 40 290" fill="none" stroke="#c8f0fb" stroke-width="9" opacity=".9"/>
  <path d="M1020 520c-26 90-16 160 24 230" fill="none" stroke="#c8f0fb" stroke-width="9" opacity=".9"/>

  <!-- улицы -->
  <g stroke="#c3b393" stroke-width="48" stroke-linecap="round">
    <path d="M0 230h1200M0 440h1200M0 640h1200M0 840h1200"/>
    <path d="M230 0v900M450 0v900M700 0v900M940 0v900"/>
  </g>
  <g stroke="#fffdf7" stroke-width="40" stroke-linecap="round">
    <path d="M0 230h1200M0 440h1200M0 640h1200M0 840h1200"/>
    <path d="M230 0v900M450 0v900M700 0v900M940 0v900"/>
  </g>
  <g stroke="#e4dcc9" stroke-width="3" stroke-dasharray="16 16">
    <path d="M0 230h1200M0 440h1200M0 640h1200M0 840h1200"/>
    <path d="M230 0v900M450 0v900M700 0v900M940 0v900"/>
  </g>

  <!-- подписи улиц -->
  <g font-family="'Segoe UI', Arial, sans-serif" font-size="19" font-weight="700" fill="#8c7f64">
    <text x="80" y="222">ул. Дальняя</text>
    <text x="520" y="432">Дальняя улица</text>
    <text x="760" y="632">ул. Аммосова</text>
    <text x="112" y="834">ул. Курашова</text>
    <text transform="translate(222 520) rotate(-90)">ул. Кирова</text>
    <text transform="translate(692 160) rotate(-90)">ул. Петровского</text>
  </g>

  <!-- маршрут -->
  <path d="M140 800c70-90 130-90 200-30s120 30 160-50 80-160 100-230" fill="none" stroke="#e62b2f" stroke-width="9" stroke-dasharray="16 14" stroke-linecap="round"/>
  <circle cx="140" cy="800" r="16" fill="#fffdf7" stroke="#0d1230" stroke-width="5"/>
  <text x="140" y="845" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="800" fill="#0d1230">ВЫ ЗДЕСЬ</text>

  <!-- метка -->
  <g filter="url(#pinShadow)">
    <path d="M600 470c-64-64-96-112-96-160a96 96 0 0 1 192 0c0 48-32 96-96 160Z" fill="#e62b2f" stroke="#0d1230" stroke-width="9"/>
    <circle cx="600" cy="310" r="46" fill="#fffdf7" stroke="#0d1230" stroke-width="7"/>
    <g fill="#0d1230" stroke="#0d1230" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="600" cy="316" rx="12" ry="18" stroke="none"/>
      <circle cx="600" cy="290" r="8" stroke="none"/>
      <g fill="none" stroke-width="5">
        <path d="M590 306 574 294 562 276M588 316l-26-2-22-16M589 326l-25 13-17 24M593 334l-14 20-8 27"/>
        <path d="M610 306l16-12 12-18M612 316l26-2 22-16M611 326l25 13 17 24M607 334l14 20 8 27"/>
      </g>
    </g>
  </g>

  <!-- карточка места -->
  <g>
    <path d="M640 392h330v106H640Z" fill="#fffdf7" stroke="#0d1230" stroke-width="6"/>
    <path d="M640 392h10v106h-10Z" fill="#e62b2f" stroke="#0d1230" stroke-width="3"/>
    <text x="672" y="430" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="800" fill="#0d1230">ДЕТСКИЙ ЦЕНТР</text>
    <text x="672" y="463" font-family="'Arial Black', Arial, sans-serif" font-size="25" fill="#e62b2f">KIDS STORY</text>
    <text x="672" y="484" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#8c7f64">ул. Дальняя, 83</text>
  </g>

  <!-- 2ГИС -->
  <g transform="translate(40 40)">
    <rect width="144" height="52" rx="8" fill="#25d366" stroke="#0d1230" stroke-width="5"/>
    <text x="72" y="35" text-anchor="middle" font-family="'Arial Black', Arial, sans-serif" font-size="25" fill="#062b15">2ГИС</text>
  </g>

  <!-- масштаб -->
  <g transform="translate(40 850)">
    <path d="M0 0h120" stroke="#0d1230" stroke-width="3"/>
    <path d="M0-8v16M60-8v16M120-8v16" stroke="#0d1230" stroke-width="3"/>
    <text x="0" y="30" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#8c7f64">200 м</text>
  </g>

  <!-- рамка -->
  <rect x="4" y="4" width="1192" height="892" fill="none" stroke="#0d1230" stroke-width="8"/>
</svg>
